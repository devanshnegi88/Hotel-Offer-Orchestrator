services:
  postgresql:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_DB: temporal
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Temporal server. Requires a persistence backend (Postgres here).
  temporal:
    image: temporalio/auto-setup:1.24.2.0
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      DB: postgresql
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: postgresql
    ports:
      - "7233:7233"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Express API: serves /health, /health/live, mock supplier endpoints, and /api/hotels.
  api:
    build: .
    command: ["node", "dist/server.js"]
    environment:
      PORT: "3000"
      NODE_ENV: production
      LOG_LEVEL: info
      LOG_FORMAT: json
      CORS_ORIGIN: "*"
      REDIS_URL: redis://redis:6379
      APP_BASE_URL: http://api:3000
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: default
    ports:
      - "3000:3000"
    depends_on:
      redis:
        condition: service_healthy
      temporal:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # Temporal worker: executes getHotelOffersWorkflow and its activities.
  worker:
    build: .
    command: ["node", "dist/temporal/worker.js"]
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      LOG_FORMAT: json
      REDIS_URL: redis://redis:6379
      APP_BASE_URL: http://api:3000
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: default
    depends_on:
      redis:
        condition: service_healthy
      temporal:
        condition: service_started
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
